name: Cloudflare vinext compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-vinext-check.yml'

permissions:
  contents: write

jobs:
  compatibility:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Front-end/package-lock.json

      - name: Install current frontend
        working-directory: Front-end
        run: npm ci

      - name: Check vinext compatibility
        working-directory: Front-end
        run: npx --yes vinext@1.0.0-beta.12 check

      - name: Generate manual Cloudflare setup
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.join(process.cwd(), 'Front-end');
          const pkgPath = path.join(root, 'package.json');
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));

          pkg.type = 'module';
          pkg.scripts = {
            ...pkg.scripts,
            'dev:vinext': 'vinext dev --port 3001',
            'build:vinext': 'vinext build',
            'start:vinext': 'vinext start',
            'deploy:vinext': 'vinext-cloudflare deploy'
          };
          pkg.dependencies = {
            ...pkg.dependencies,
            'vinext': '1.0.0-beta.12',
            '@vinext/cloudflare': '1.0.0-beta.10',
            'react-server-dom-webpack': '19.2.8'
          };
          pkg.devDependencies = {
            ...pkg.devDependencies,
            '@cloudflare/vite-plugin': '1.60.2',
            '@vitejs/plugin-rsc': '0.5.35',
            'vite': '8.3.1',
            'wrangler': '4.141.0'
          };
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const gitignorePath = path.join(root, '.gitignore');
          let gitignore = fs.readFileSync(gitignorePath, 'utf8');
          for (const entry of ['/dist/', '.vinext/', '.wrangler/']) {
            if (!gitignore.split('\n').includes(entry)) gitignore += entry + '\n';
          }
          fs.writeFileSync(gitignorePath, gitignore);

          fs.writeFileSync(path.join(root, 'vite.config.ts'), `import { cloudflare } from "@cloudflare/vite-plugin";
          import vinext from "vinext";
          import { defineConfig } from "vite";

          export default defineConfig({
            plugins: [
              vinext(),
              cloudflare({
                viteEnvironment: {
                  name: "rsc",
                  childEnvironments: ["ssr"],
                },
              }),
            ],
          });
          `.replace(/^ {10}/gm, ''));

          fs.writeFileSync(path.join(root, 'wrangler.jsonc'), JSON.stringify({
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "nexoaula-web",
            "compatibility_date": "2026-09-25",
            "compatibility_flags": ["nodejs_compat"],
            "main": "vinext/server/fetch-handler",
            "assets": {
              "directory": "dist/client",
              "not_found_handling": "none",
              "binding": "ASSETS"
            }
          }, null, 2) + '\n');
          NODE

      - name: Resolve Cloudflare dependencies and lockfile
        working-directory: Front-end
        run: npm install

      - name: Build with vinext
        working-directory: Front-end
        env:
          API_BASE_URL: http://127.0.0.1:8000
        run: npm run build:vinext

      - name: Commit validated setup to handoff branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Front-end/package.json Front-end/package-lock.json Front-end/.gitignore Front-end/vite.config.ts Front-end/wrangler.jsonc
          git commit -m "chore: prepare frontend for Cloudflare Workers"
          git push --force origin HEAD:refs/heads/automation/cloudflare-validated
