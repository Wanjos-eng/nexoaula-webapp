name: Cloudflare vinext compatibility

on:
  push:
    branches: [main]
    paths:
      - 'Front-end/**'
      - '.github/workflows/cloudflare-vinext-check.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front-end

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Front-end/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check vinext compatibility
        shell: bash
        run: |
          set +e
          mkdir -p ../vinext-report
          npx --yes vinext@latest check 2>&1 | tee ../vinext-report/vinext-check.txt
          status=${PIPESTATUS[0]}
          printf '\nvinext_check_exit_code=%s\n' "$status" >> ../vinext-report/vinext-check.txt
          exit 0

      - name: Upload compatibility report
        uses: actions/upload-artifact@v4
        with:
          name: vinext-compatibility-report
          path: vinext-report/vinext-check.txt
          if-no-files-found: error
          retention-days: 7

      - name: Pin React Server Components runtime
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides = {
            ...(pkg.overrides ?? {}),
            'react-server-dom-webpack': '19.2.8'
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Generate Cloudflare configuration
        shell: bash
        run: |
          set +e
          mkdir -p ../vinext-report
          CI=1 npx --yes vinext@latest init \
            --platform=cloudflare \
            --skip-check \
            --cdn-cache=none \
            --data-cache=none \
            --image-optimization=none \
            2>&1 | tee ../vinext-report/vinext-init.txt
          status=${PIPESTATUS[0]}
          printf '\nvinext_init_exit_code=%s\n' "$status" >> ../vinext-report/vinext-init.txt
          exit "$status"

      - name: Upload init report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinext-init-report
          path: vinext-report/vinext-init.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Collect generated configuration
        if: success()
        shell: bash
        run: |
          mkdir -p ../vinext-generated
          cp package.json package-lock.json vite.config.ts wrangler.jsonc ../vinext-generated/

      - name: Upload generated configuration
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vinext-generated-config
          path: vinext-generated/
          if-no-files-found: error
          retention-days: 7
