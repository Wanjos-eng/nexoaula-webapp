name: Data model validation

on:
  pull_request:
    paths:
      - 'docs/architecture/**'
      - 'docs/diagrams/**'
      - 'scripts/*data-model.cjs'
      - 'tools/data-model/**'
      - '.github/workflows/data-model.yml'
  push:
    branches: [main]
    paths:
      - 'docs/architecture/**'
      - 'docs/diagrams/**'
      - 'scripts/*data-model.cjs'
      - 'tools/data-model/**'
      - '.github/workflows/data-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model:
    name: DBML integrity and diagrams
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install isolated locked tooling
        run: npm ci --prefix tools/data-model --ignore-scripts
      - name: Validate DBML in disposable PostgreSQL
        run: node scripts/validate-data-model.cjs tools/data-model > data-model-validation.json
      - name: Verify generated diagrams
        run: node scripts/render-data-model.cjs --check
      - name: Store model evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: data-model-validation
          path: data-model-validation.json
          if-no-files-found: error
          retention-days: 14
