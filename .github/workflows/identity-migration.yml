name: Identity migration checks

on:
  pull_request:
    paths:
      - 'Back-end/apps/api/**'
      - 'compose.yml'
      - '.github/workflows/identity-migration.yml'
  push:
    branches: [main]
    paths:
      - 'Back-end/apps/api/**'
      - 'compose.yml'
      - '.github/workflows/identity-migration.yml'

permissions:
  contents: read

jobs:
  identity-migration:
    name: Upgrade, inspect, downgrade and upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+psycopg2://nexoaula:nexoaula_local@localhost:5432/nexoaula
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Back-end/apps/api/requirements.txt

      - name: Install backend dependencies
        working-directory: Back-end/apps/api
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Start clean PostgreSQL
        run: |
          docker compose down --volumes
          docker compose up -d --wait

      - name: Upgrade and inspect the released schema
        working-directory: Back-end/apps/api
        run: |
          python -m alembic upgrade head
          python -m pytest -q \
            tests/test_config.py \
            tests/test_migration_scaffold.py \
            tests/test_identity_migration.py \
            tests/test_academic_group_migration.py \
            tests/integration/academic \
            tests/unit/users \
            tests/integration/users \
            tests/unit/auth \
            tests/integration/auth \
            --cov=app.modules.auth \
            --cov=app.modules.users \
            --cov-report=term-missing \
            --cov-fail-under=90
          python -m alembic check

      - name: Roll back only the academic and group revision
        working-directory: Back-end/apps/api
        run: |
          python -m alembic downgrade 0001_identity
          python -c "from app.db.session import create_database_engine; from sqlalchemy import inspect; engine = create_database_engine(); assert set(inspect(engine).get_table_names()) == {'alembic_version', 'users', 'user_profiles', 'auth_tokens'}; engine.dispose()"
          python -m alembic upgrade head
          python -m pytest -q tests/test_academic_group_migration.py
          python -m pytest -q tests/integration/academic
          python -m alembic check

      - name: Downgrade to the empty base
        working-directory: Back-end/apps/api
        run: |
          python -m alembic downgrade base
          test "$(docker compose -f ../../../compose.yml exec -T db psql \
            --username nexoaula \
            --dbname nexoaula \
            --tuples-only \
            --no-align \
            --command "SELECT count(*) FROM pg_tables WHERE schemaname = 'public' AND tablename <> 'alembic_version';")" = "0"
          test "$(docker compose -f ../../../compose.yml exec -T db psql \
            --username nexoaula \
            --dbname nexoaula \
            --tuples-only \
            --no-align \
            --command "SELECT count(*) FROM pg_type WHERE typname IN ('auth_token_type', 'group_visibility', 'group_join_policy', 'group_status', 'membership_role', 'membership_status');")" = "0"

      - name: Upgrade again from the empty base
        working-directory: Back-end/apps/api
        run: |
          python -m alembic upgrade head
          python -m pytest -q \
            tests/test_identity_migration.py \
            tests/test_academic_group_migration.py \
            tests/integration/academic \
            tests/integration/users \
            tests/integration/auth

      - name: Show database diagnostics on failure
        if: failure()
        run: docker compose ps && docker compose logs db

      - name: Remove CI database
        if: always()
        run: docker compose down --volumes
