name: Generate Supabase migration SQL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase-migration-sql.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Back-end/apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Back-end/apps/api/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate offline migration SQL
        env:
          DATABASE_URL: postgresql+psycopg2://nexoaula:nexoaula@localhost:5432/nexoaula
          ENVIRONMENT: production
        run: |
          mkdir -p ../../../migration-artifacts
          python -m alembic upgrade head --sql > ../../../migration-artifacts/nexoaula-head.sql

      - name: Verify generated SQL
        run: |
          test -s ../../../migration-artifacts/nexoaula-head.sql
          grep -q "alembic_version" ../../../migration-artifacts/nexoaula-head.sql
          grep -q "channel_messages" ../../../migration-artifacts/nexoaula-head.sql
          grep -q "group_invitations" ../../../migration-artifacts/nexoaula-head.sql

      - name: Upload SQL
        uses: actions/upload-artifact@v4
        with:
          name: nexoaula-supabase-migration-sql
          path: migration-artifacts/nexoaula-head.sql
          if-no-files-found: error
          retention-days: 7
