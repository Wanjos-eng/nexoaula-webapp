name: Frontend preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "Front-end/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: frontend-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Validate and deploy frontend preview
    # Secrets are intentionally unavailable to forked pull requests.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front-end

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: Front-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Deploy preview to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_SCOPE" ]; then
            echo "::error::Configure the VERCEL_TOKEN repository secret and VERCEL_SCOPE repository variable before running this workflow."
            exit 1
          fi

          npm install --global vercel@59.3.0
          deployment_url="$(vercel deploy --yes --scope="$VERCEL_SCOPE" --name=nexoaula-webapp-demo --token="$VERCEL_TOKEN" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n 1)"

          if [ -z "$deployment_url" ]; then
            echo "::error::Vercel did not return a preview URL."
            exit 1
          fi

          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Preview: $deployment_url"

      - name: Comment preview URL on pull request
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = "<!-- nexoAula-vercel-preview -->";
            const body = `${marker}\n✅ Frontend preview: ${process.env.PREVIEW_URL}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
