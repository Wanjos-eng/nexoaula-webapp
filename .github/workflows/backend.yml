name: Backend checks

on:
  pull_request:
    paths:
      - 'Back-end/**'
      - 'setup.ps1'
      - 'setup.sh'
      - '.gitattributes'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'Back-end/**'
      - 'setup.ps1'
      - 'setup.sh'
      - '.gitattributes'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  backend:
    name: Python 3.11 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Back-end/apps/api/requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install and verify dependencies
        working-directory: Back-end/apps/api
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Test API, config and setup scripts
        working-directory: Back-end/apps/api
        run: python -m pytest -q
      - name: Inspect empty migration history (no database)
        working-directory: Back-end/apps/api
        run: python -m alembic history
