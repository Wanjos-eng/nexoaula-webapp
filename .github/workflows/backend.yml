name: Backend checks

on:
  pull_request:
    paths:
      - 'Back-end/**'
      - 'setup.ps1'
      - 'setup.sh'
      - '.gitattributes'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'Back-end/**'
      - 'setup.ps1'
      - 'setup.sh'
      - '.gitattributes'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  backend:
    name: Python 3.11 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Back-end/apps/api/requirements.txt
      - name: Install and verify dependencies
        working-directory: Back-end/apps/api
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Test API, config and setup scripts
        working-directory: Back-end/apps/api
        run: python -m pytest -q
      - name: Inspect empty migration history (no database)
        working-directory: Back-end/apps/api
        run: python -m alembic history
